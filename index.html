<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dr. Malith Senarathne</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#000000,#1a1a1a,#444444);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
overflow-x:hidden;
color:white;
}

body::before{
content:"";
position:fixed;
width:700px;
height:700px;
background:radial-gradient(circle,#d4af3722,transparent 70%);
top:-250px;
right:-200px;
z-index:-1;
}

body::after{
content:"";
position:fixed;
width:600px;
height:600px;
background:radial-gradient(circle,#ffffff11,transparent 70%);
bottom:-250px;
left:-200px;
z-index:-1;
}

.container{

width:100%;
max-width:460px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.15);

border-radius:35px;

padding:35px 25px;

text-align:center;

box-shadow:0 25px 60px rgba(0,0,0,.6);

animation:fade 1s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.profile{

width:150px;

height:150px;

border-radius:50%;

object-fit:cover;

border:5px solid #d4af37;

box-shadow:
0 0 20px #d4af37,
0 0 50px rgba(212,175,55,.5);

transition:.4s;

}

.profile:hover{

transform:scale(1.05);

}

h1{

margin-top:22px;

font-size:30px;

font-weight:700;

}

.subtitle{

margin-top:10px;

color:#d8d8d8;

font-size:15px;

line-height:1.5;

}

.buttons{

margin-top:30px;

}

.btn{

display:flex;

justify-content:center;

align-items:center;

gap:12px;

padding:17px;

margin:15px 0;

border-radius:50px;

text-decoration:none;

font-size:17px;

font-weight:600;

color:white;

background:linear-gradient(135deg,#2d2d2d,#111);

border:1px solid rgba(255,255,255,.15);

box-shadow:0 10px 25px rgba(0,0,0,.35);

transition:.35s;

-webkit-tap-highlight-color:transparent;

}

.btn:hover,

.btn:active{

transform:translateY(-6px) scale(1.03);

background:linear-gradient(135deg,#000,#2a2a2a);

border:1px solid #d4af37;

box-shadow:

0 0 18px rgba(212,175,55,.45),

0 20px 35px rgba(0,0,0,.55);

}

.gold{

border:2px solid #d4af37;

}

footer{

margin-top:30px;

font-size:13px;

color:#bfbfbf;

}

</style>

</head>

<body>

<div class="container">

<img src="profile.jpg" class="profile" alt="Dr. Malith Senarathne">

<h1>👋 Welcome to Dr. Malith's Website</h1>

<p class="subtitle">

Medical Doctor • Healthcare • Education • Wellness

</p>

<div class="buttons">

<a class="btn gold" href="#">👨‍⚕️ About Me</a>

<a class="btn" href="#">📚 Medical Articles</a>

<a class="btn" href="#">📅 Book an Appointment</a>

<a class="btn" href="#">🏥 My Clinic</a>

<a class="btn" href="#">📘 Facebook</a>

<a class="btn" href="#">📸 Instagram</a>

<a class="btn" href="#">🎵 TikTok</a>

<a class="btn" href="#">💼 LinkedIn</a>

<a class="btn" href="#">📞 Contact Me</a>

</div>

<footer>

© 2026 Dr. Malith Senarathne

</footer>

</div>

</body>
</html>
